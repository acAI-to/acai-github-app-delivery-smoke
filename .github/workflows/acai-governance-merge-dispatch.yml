name: acai-governance-merge-dispatch

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Validated target PR number
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: write
  statuses: read

jobs:
  pre:
    runs-on: [self-hosted, linux, x64, acai-internal]
    outputs:
      pr: ${{ steps.guard.outputs.pr }}
      head: ${{ steps.guard.outputs.head }}
      release_sha: ${{ steps.guard.outputs.release_sha }}
      trust: ${{ steps.guard.outputs.trust }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          RELEASE_SHA: ${{ vars.ACAI_GOVERNANCE_PACKAGE_RELEASE_SHA }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/$REPO/pulls/$PR")"
          FORK="$(printf '%s' "$PR_JSON" | jq -r '.head.repo.fork')"
          HEAD="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          TRUST="$(jq -cn --arg sha "$RELEASE_SHA" '{schema:"acai-governance-package-target-trust/v1",source_repository:"acAI-to/acai-harness",workflow_path:".github/workflows/acai-governance-package-evaluator.yml",workflow_ref:"stable",release_commit_sha:$sha,interface:"v1"}')"
          jq -cn --argjson trust "$TRUST" --argjson fork "$FORK" '{trust:$trust,mode:"merge",fork:$fork}' | python3 scripts/governance_package_target.py target-pre
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "trust=$TRUST" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: pre
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    uses: acAI-to/acai-harness/.github/workflows/acai-governance-package-evaluator.yml@stable
    with:
      interface: v1
      mode: merge
      expected_release_sha: ${{ needs.pre.outputs.release_sha }}
      repository: ${{ github.repository }}
      pr: ${{ needs.pre.outputs.pr }}
      head_sha: ${{ needs.pre.outputs.head }}

  post:
    needs: [pre, evaluate]
    if: needs.evaluate.outputs.eligible == 'true'
    runs-on: [self-hosted, linux, x64, acai-internal]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify exact called SHA immediately before expected-head merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ needs.pre.outputs.head }}
          RUN_ID: ${{ github.run_id }}
          TRUST: ${{ needs.pre.outputs.trust }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          jq -cn --argjson trust "$TRUST" --argjson run "$RUN" --argjson run_id "$RUN_ID" '{trust:$trust,mode:"merge",fork:false,run:$run,run_id:$run_id}' | python3 scripts/governance_package_target.py target-post
          test "$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)" = "$HEAD"
          gh api --method PUT "repos/$REPO/pulls/$PR/merge" -f sha="$HEAD" -f merge_method=squash
