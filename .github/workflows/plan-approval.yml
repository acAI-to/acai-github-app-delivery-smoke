name: plan-approval

on:
  issues:
    types: [labeled, edited, unlabeled]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  attest-or-invalidate:
    runs-on: [self-hosted, linux, x64, acai-internal]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Attest label event or invalidate edited material
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_ACTOR: ${{ github.event.sender.login }}
          OPERATOR_LOGINS: ${{ vars.ACAI_OPERATOR_GITHUB_LOGINS }}
          INDEPENDENT_REVIEW_LOGINS: ${{ vars.ACAI_INDEPENDENT_REVIEW_GITHUB_LOGINS }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRUSTED_REF: ${{ github.event.repository.default_branch }}
          TRUSTED_ROOT: ${{ runner.temp }}/trusted-governance
        run: |
          set -euo pipefail
          gh repo clone "$REPO" "$TRUSTED_ROOT" -- --quiet --no-recurse-submodules --depth=1 --branch "$TRUSTED_REF"
          cd "$TRUSTED_ROOT"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          LABEL=acai-plan-approved
          ISSUE="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json number,body,labels)"
          HAS_LABEL="$(printf '%s' "$ISSUE" | jq --arg label "$LABEL" 'any(.labels[]?; .name == $label)')"

          if [ "$ACTION" = labeled ] && [ "$EVENT_LABEL" = "$LABEL" ]; then
            if ! python3 - "$EVENT_ACTOR" "$OPERATOR_LOGINS" <<'PY'
          import sys
          actor = sys.argv[1]
          allowed = {item.strip() for item in sys.argv[2].split(",") if item.strip()}
          raise SystemExit(0 if actor in allowed else 1)
          PY
            then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$LABEL"
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Plan approval rejected: label-event actor @$EVENT_ACTOR is not allowlisted."
              exit 1
            fi
            if [ "$HAS_LABEL" != true ]; then
              echo "Approval label no longer present; stale labeled event ignored."
              exit 0
            fi
            COMMENTS="$(gh api --paginate "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s 'add // []')"
          if ! ISSUE_JSON="$ISSUE" COMMENTS_JSON="$COMMENTS" python3 - "$REPO" "$INDEPENDENT_REVIEW_LOGINS" <<'PY'
          import json, os, sys
          from scripts.plan_approval import latest_plan_review, validate_plan_review
          issue = json.loads(os.environ["ISSUE_JSON"])
          comments = json.loads(os.environ["COMMENTS_JSON"])
          reasons = validate_plan_review(
              repository=sys.argv[1], issue=issue, comment=latest_plan_review(comments),
              allowlist={value.strip() for value in sys.argv[2].split(",") if value.strip()},
          )
          if reasons:
              print("; ".join(reasons), file=sys.stderr)
              raise SystemExit(1)
          PY
            then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$LABEL"
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Plan approval rejected: current independent plan review is missing or invalid. Reapply \`$LABEL\` after the review passes."
              exit 1
            fi
            EVENT_DIGEST="$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json, sys
          from scripts.plan_approval import material_digest
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(material_digest(json.load(handle)["issue"]["body"]))
          PY
          )"
            DIGEST="$(printf '%s' "$ISSUE" | python3 -c 'import json,sys; from scripts.plan_approval import material_digest; print(material_digest(json.load(sys.stdin)["body"]))')"
            if [ "$DIGEST" != "$EVENT_DIGEST" ]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$LABEL"
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Plan approval rejected: material changed after the label event. Reapply \`$LABEL\` to the final plan."
              exit 1
            fi
            APPROVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            BODY="$(printf '%s\n' \
              '<!-- ACAI-PLAN-APPROVAL -->' \
              'Version: 2' \
              "Repository: $REPO" \
              "Issue: #$ISSUE_NUMBER" \
              "Actor: $EVENT_ACTOR" \
              "Label: $LABEL" \
              "Digest-SHA256: $DIGEST" \
              "Event-Digest-SHA256: $EVENT_DIGEST" \
              "Approved-At: $APPROVED_AT" \
              'Source-Event: issues:labeled' \
              "Source-URL: $RUN_URL" \
              'Current-Label: present')"
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$BODY"
            exit 0
          fi

          if [ "$ACTION" = edited ] && [ "$HAS_LABEL" = true ]; then
            COMMENTS="$(gh api --paginate "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s 'add // []')"
            TIMELINE="$(gh api --paginate "repos/$REPO/issues/$ISSUE_NUMBER/timeline?per_page=100" | jq -s 'add // []')"
            PREVIOUS_BODY="$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              event = json.load(handle)
          print((((event.get("changes") or {}).get("body") or {}).get("from") or ""))
          PY
            )"
            if [ -n "$PREVIOUS_BODY" ]; then
              MIGRATION="$(ISSUE_JSON="$ISSUE" COMMENTS_JSON="$COMMENTS" TIMELINE_JSON="$TIMELINE" PREVIOUS_BODY="$PREVIOUS_BODY" python3 - "$REPO" "$OPERATOR_LOGINS" <<'PY'
          import json, os, sys
          from scripts.plan_approval import v1_migration_attestation
          fields, reasons = v1_migration_attestation(
              repository=sys.argv[1], issue=json.loads(os.environ["ISSUE_JSON"]),
              comments=json.loads(os.environ["COMMENTS_JSON"]), timeline=json.loads(os.environ["TIMELINE_JSON"]),
              allowlist={value.strip() for value in sys.argv[2].split(",") if value.strip()},
              previous_body=os.environ["PREVIOUS_BODY"],
          )
          print(json.dumps({"fields": fields or {}, "reasons": reasons}))
          PY
              )"
              if [ "$(printf '%s' "$MIGRATION" | jq '.reasons | length')" = 0 ]; then
                MIGRATION_DIGEST="$(printf '%s' "$ISSUE" | python3 -c 'import json,sys; from scripts.plan_approval import material_digest; print(material_digest(json.load(sys.stdin)["body"]))')"
                MIGRATION_ACTOR="$(printf '%s' "$MIGRATION" | jq -r '.fields.Actor')"
                APPROVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                BODY="$(printf '%s\n' \
                  '<!-- ACAI-PLAN-APPROVAL -->' \
                  'Version: 2' \
                  "Repository: $REPO" \
                  "Issue: #$ISSUE_NUMBER" \
                  "Actor: $MIGRATION_ACTOR" \
                  "Label: $LABEL" \
                  "Digest-SHA256: $MIGRATION_DIGEST" \
                  "Event-Digest-SHA256: $MIGRATION_DIGEST" \
                  "Approved-At: $APPROVED_AT" \
                  'Source-Event: issues:edited-migration' \
                  "Source-URL: $RUN_URL" \
                  'Current-Label: present')"
                gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$BODY"
                echo "Migrated stable v1 approval to v2 after mutable-only issue edit."
                exit 0
              fi
            fi
            printf '%s' "$ISSUE" > "$TMP_DIR/issue.json"
            printf '%s' "$COMMENTS" > "$TMP_DIR/comments.json"
            printf '%s' "$TIMELINE" > "$TMP_DIR/timeline.json"
            set +e
            DETAIL="$(jq -n --arg repository "$REPO" --arg logins "$OPERATOR_LOGINS" --slurpfile issue "$TMP_DIR/issue.json" --slurpfile comments "$TMP_DIR/comments.json" --slurpfile timeline "$TMP_DIR/timeline.json" \
              '{repository:$repository,issue:$issue[0],comments:$comments[0],timeline:$timeline[0],operator_logins:($logins|split(",")|map(select(length>0)))}' \
              | python3 scripts/plan_approval.py)"
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$LABEL"
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "<!-- ACAI-PLAN-APPROVAL-INVALIDATED -->
          Plan approval invalidated after material issue edit: $DETAIL
          Reapprove by applying `$LABEL` after the plan/rubric is final."
            fi
          fi
