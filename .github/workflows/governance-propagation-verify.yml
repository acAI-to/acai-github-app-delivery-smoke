name: governance-propagation-verify

on:
  workflow_dispatch:
    inputs:
      source_repository: {required: true, type: string}
      source_pr: {required: true, type: string}
      target_pr: {required: true, type: string}

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, acai-internal]
    outputs:
      tier1_eligible: ${{ steps.verify.outputs.tier1_eligible }}
      target_head: ${{ steps.verify.outputs.target_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect APIs and verify immutable propagation without PR checkout
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source_repository }}
          SOURCE_PR: ${{ inputs.source_pr }}
          TARGET: ${{ github.repository }}
          TARGET_PR: ${{ inputs.target_pr }}
        run: |
          set -euo pipefail
          jq -n --arg source_repository "$SOURCE" --arg source_pr "$SOURCE_PR" --arg target_repository "$TARGET" --arg target_pr "$TARGET_PR" '{source_repository:$source_repository,source_pr:$source_pr,target_repository:$target_repository,target_pr:$target_pr}' | python3 scripts/governance_propagation_collect.py > provenance.json
          python3 scripts/governance_propagation_verify.py < provenance.json | tee eligibility.json
          test "$(jq -r .tier1_eligible eligibility.json)" = true
          TARGET_HEAD="$(jq -r .target.head provenance.json)"
          test "$TARGET_HEAD" != null
          printf 'tier1_eligible=true\ntarget_head=%s\n' "$TARGET_HEAD" >> "$GITHUB_OUTPUT"
