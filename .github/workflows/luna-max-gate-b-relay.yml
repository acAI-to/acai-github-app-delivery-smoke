name: luna-max-gate-b-relay

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
      head_sha:
        description: Full commit SHA reviewed by the independent Luna/max reviewer
        required: true
      session_id:
        description: Luna/max review session ID
        required: true
      verdict:
        description: PASS or FAIL
        required: true
      findings:
        description: Concise raw Luna/max review findings
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  relay:
    runs-on: [self-hosted, linux, x64, acai-internal]
    steps:
      - name: Validate relay actor, PR head, and verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELAY_ACTOR: ${{ github.triggering_actor }}
          ALLOWED_RELAYS: ${{ vars.ACAI_LUNA_MAX_REVIEW_GITHUB_LOGINS }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          VERDICT: ${{ inputs.verdict }}
          SESSION_ID: ${{ inputs.session_id }}
          FINDINGS: ${{ inputs.findings }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case ",$ALLOWED_RELAYS," in *",$RELAY_ACTOR,"*) ;; *) echo "relay actor is not allowlisted" >&2; exit 1;; esac
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERDICT" = PASS || "$VERDICT" = FAIL ]]
          ACTUAL_HEAD="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)"
          [ "$ACTUAL_HEAD" = "$HEAD_SHA" ]
          BODY="$(printf '%s\n' \
            '<!-- ACAI-GATE-B -->' \
            "Gate-B: $VERDICT" \
            "Commit: $HEAD_SHA" \
            'Reviewer: luna-max' \
            "Session: $SESSION_ID" \
            "Relay-Actor: $RELAY_ACTOR" \
            'Source-Event: workflow_dispatch' \
            "Source-URL: $RUN_URL" \
            'Contract-Version: 2' \
            'Model: gpt-5.6-luna' \
            'Reasoning: max' \
            '' \
            "$FINDINGS")"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          if [ "$VERDICT" = PASS ]; then
            STATUS_STATE=success
          else
            STATUS_STATE=failure
          fi
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATUS_STATE" \
            -f context='governance/gate-b' \
            -f description="Gate B $VERDICT from trusted Luna/max relay" \
            -f target_url="$RUN_URL"
